# included 를 두지 않고 레포 전체를 검사한다 (생성물만 제외).
excluded:
  - "**/Derived"
  - build
  - .build

# SwiftFormat 과 겹치거나 충돌하는 규칙은 끈다 (포맷은 SwiftFormat 이 담당)
disabled_rules:
  - trailing_comma
  - opening_brace
  - todo

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - private_swiftui_state
  - sorted_first_last
  - toggle_bool
  - unowned_variable_capture
  - weak_delegate

line_length:
  warning: 120
  ignores_comments: true
  ignores_urls: true

# Model 의 async 흐름은 private(set) 상태를 바꾸므로 Model 파일에 둔다 (읽기 전용 계산 프로퍼티만 다른 파일 extension 에 둘 수 있다,
# docs/ARCHITECTURE.md:38). 그래서 레포 전체 경고 기준을 600줄로 둔다 (한 화면에 흐름이 많은 Launcher Model 이 500줄을 넘기 때문)
file_length:
  warning: 600

# CPU 아키텍처 이름 `x86_64` (예: CPUArchitecture.x86_64) 는 그대로 쓴다
identifier_name:
  excluded: [id, x, y, tv, x86_64]

# 식별자 래퍼 타입 이름 `ID` (예: VirtualDevice.ID) 는 Identifiable 관례를 따른다
type_name:
  excluded: [ID]

# ── 아키텍처 규칙 (docs/ARCHITECTURE.md) ─────────────────────────────
custom_rules:
  impl_import_only_in_app:
    name: "Impl 은 App 에서만 import"
    included: "Projects/(Features|Clients/[^/]+/(Interface|Impl|Testing))/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?\\w+Impl(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "Client Impl 은 App 모듈에서만 import 합니다. Feature 와 다른 Client Impl 은 Interface 에 의존하세요."
    severity: error

  testing_import_not_in_production:
    name: "Testing 모듈은 테스트/Example 에서만"
    included: "Projects/(App/Sources|Features/[^/]+/Sources|Clients/[^/]+/(Interface|Impl))/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?\\w+Testing(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "Fake 가 든 Testing 모듈은 Tests 와 Example 타깃에서만 import 합니다."
    severity: error

  # 권한·저장·결제·알림처럼 부수효과가 있는 Apple 프레임워크. 앱에 맞게 목록을 늘리거나 줄인다 (docs/ARCHITECTURE.md §2).
  system_framework_only_in_impl:
    name: "부수효과 프레임워크는 Client Impl 에서만"
    included: "Projects/(App|Features|Shared|Clients/[^/]+/(Interface|Testing))/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(Photos|PhotosUI|Vision|FoundationModels|SwiftData|CoreData|CloudKit|StoreKit|UserNotifications|HealthKit|Contacts|EventKit|AVFoundation)(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "권한·저장·결제·알림 같은 부수효과 프레임워크는 Client Impl 안에서만 사용합니다. Interface 나 Core 에 값 타입을 정의하세요."
    severity: error

  shared_independent_of_clients:
    name: "Shared 는 Client 에 의존하지 않음"
    included: "Projects/Shared/[^/]+/Sources/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?\\w+(Interface|Impl|Testing)(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "Shared 모듈은 여러 모듈이 함께 쓰는 순수 코드입니다. Client 가 Shared 에 의존하고, 그 반대는 하지 않습니다."
    severity: error

  core_no_ui_framework:
    name: "Core 는 UI 프레임워크를 쓰지 않음"
    included: "Projects/Shared/Core/Sources/"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+((typealias|struct|class|enum|protocol|let|var|func)\\s+)?(SwiftUI|UIKit|AppKit)(\\.\\w+)*\\s*(//[^\\n]*|/\\*[^\\n]*)?$"
    message: "Core 는 부수효과 없는 도메인 값 타입·규칙입니다. 화면 코드는 Feature 나 DesignSystem 에, 앱 열기 같은 부수효과는 Client Impl 에 둡니다."
    severity: error

  no_two_way_model_binding:
    name: "Model 양방향 바인딩 금지"
    included: "Projects/Features/"
    regex: "\\$(self\\.)?model\\."
    message: "Model 상태는 private(set) 입니다. Binding(get:set:) 으로 이벤트 메서드를 호출하세요."
    severity: error

  process_only_in_command_impl:
    name: "Process 생성·호출은 Command Client Impl 에서만"
    included: "Projects/"
    excluded: "Projects/Clients/Command/Impl/"
    regex: "\\b(Process|NSTask)\\s*[(.]"
    match_kinds: [identifier, typeidentifier]
    message: "Process(NSTask) 생성·호출은 Command Client Impl 에만 둡니다. Feature·Core·다른 Client Impl 에서는 하지 않고, 명령이 필요한 Client Impl 은 CommandClient 를 주입받아 실행하세요."
    severity: error
  network_only_in_download_impl:
    name: "네트워크 요청은 Download Client Impl 에서만"
    included: "Projects/"
    excluded: "Projects/Clients/Download/Impl/"
    regex: "\\b(URLSession\\w*|NSURLSession\\w*|NSURLConnection|NWConnection|NWListener|NWBrowser|NWPathMonitor)\\b"
    match_kinds: [identifier, typeidentifier]
    message: "네트워크 요청(URLSession 등)은 Download Client Impl 에만 둡니다. Feature·Core·다른 Client(Interface·Testing 포함)는 DownloadClient 를 주입받아 쓰고, 테스트는 URLProtocol 스텁을 Impl 의 protocolClasses 로 주입하세요."
    severity: error
  # 관리자 `defaults write`·구성 프로필(MDM)이 같은 도메인·키를 쓰고 강제 값 잠금(`objectIsForced`)을 한 곳에서 판정하도록,
  # 사용자 설정 읽기·쓰기는 Preferences Client Impl 에만 둔다 (docs/ARCHITECTURE.md §4).
  preferences_only_in_preferences_impl:
    name: "사용자 설정 저장은 Preferences Client Impl 에서만"
    included: "Projects/"
    excluded: "Projects/Clients/Preferences/Impl/"
    regex: "\\b(UserDefaults|NSUserDefaults\\w*|CFPreferences\\w*|NSUbiquitousKeyValueStore|AppStorage)\\b"
    match_kinds: [identifier, typeidentifier]
    message: "사용자 설정 저장(UserDefaults·@AppStorage 등)은 Preferences Client Impl 에만 둡니다. Feature·App·다른 Client 는 PreferencesClient 를 주입받고, Impl 테스트는 PreferenceStore 를 주입하세요. @SceneStorage 는 View 일시 상태라 허용합니다."
    severity: error
