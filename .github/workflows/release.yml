name: Release

# 배포 워크플로 (docs/RELEASING.md). 버전 주석 태그(예: 1.2.0)를 push 하면 main 에 머지된 그 커밋을 Developer ID 로 서명·공증한
# dmg 를 만들어 GitHub Release 로 게시한다. 노트는 PR 목록 + Claude 요약(실패하면 PR 목록만).
#   check  : 태그·버전·빌드 번호·이미 게시 여부 판정 (.github/scripts/release-check.sh)
#   build  : xcode-27 러너에서 release 환경 시크릿으로 임시 키체인을 만들고 make release (CI 모드, scripts/release.sh)
#   notes  : 노트 재료(PR 목록·PR 본문) → Claude Code CLI 요약(도구·레포 파일·GitHub 토큰 없음) → 요약 검사 (build 와 병렬)
#   publish: dmg 해시·태그 재확인 → Release 게시 → 게시본 확인
# workflow_dispatch 는 시험 실행이다: main 에서만, 공증까지 하고 게시하지 않는다(노트는 아티팩트·요약 화면으로).
# 셸(run:)에 ${{ }} 를 직접 넣지 않는다. 값은 모두 단계 env 로 받는다.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+'] # 주석 태그인지는 check 가 본다. sample-* 태그는 걸리지 않는다
  workflow_dispatch:

# 태그·시험 실행 모두 한 줄로 돌린다(늦게 끝난 쪽이 latest 가 되는 경합 방지). 공증·게시 도중에는 취소하지 않는다.
# 같은 그룹에서 대기 중인 run 은 새 run 이 오면 취소된다 → 연달아 push 한 태그는 Re-run (RELEASING 4절).
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

# shell 을 적어야 GitHub 이 bash -eo pipefail 로 돌린다(기본값은 pipefail 없음). gh api … | release-check.sh plan 처럼
# 파이프 앞쪽 실패를 놓치지 않게 한다.
defaults:
  run:
    shell: bash

jobs:
  # 판정만 한다. 출력: mode(publish|trial)·tag(trial 은 빈 값)·commit(전체 sha)·version·build
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.push.outputs.mode || steps.trial.outputs.mode }}
      tag: ${{ steps.push.outputs.tag || steps.trial.outputs.tag }}
      commit: ${{ steps.push.outputs.commit || steps.trial.outputs.commit }}
      version: ${{ steps.push.outputs.version || steps.trial.outputs.version }}
      build: ${{ steps.push.outputs.build || steps.trial.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # 태그 push 로 체크아웃하면 그 태그가 로컬에 경량으로 만들어질 수 있어 원격 태그로 덮는다(판정 자체는 API 로 한다).
      - name: 원격 태그 받기
        run: git fetch --force --tags origin
      - id: push
        name: 태그 판정
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release-check.sh push "$REPO" "$TAG"
      - id: trial
        name: 시험 실행 판정
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: .github/scripts/release-check.sh trial "$REF" "$SHA"

  # 서명·공증. Claude 는 이 잡에 없다. 시크릿은 release 환경(main·버전 태그만 배포 가능)에만 두고 쓰는 단계의 env 로만 받는다.
  build:
    needs: check
    runs-on: xcode-27
    timeout-minutes: 180 # 공증 대기 최대 1h×2 + archive + 도구 설치. 미리보기 레이블이라 Queued 로 오래 머물 수 있다
    environment: release
    permissions:
      contents: read
    # 상수라 잡 수준에 둔다(모든 단계가 처음부터 이 Xcode 를 본다). 러너·Xcode 를 바꿀 때 이 두 줄과 RELEASING 을 고친다.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      XCODE_BUILD: 27B52
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      # $GITHUB_ENV 값은 다음 단계부터 적용되므로 이 단계에서는 RELEASE_KEYCHAIN·SECRETS_DIR 를 쓰지 않는다.
      - name: 준비
        run: |
          echo "RELEASE_KEYCHAIN=$RUNNER_TEMP/release-signing.keychain-db" >> "$GITHUB_ENV"
          echo "SECRETS_DIR=$RUNNER_TEMP/release-secrets" >> "$GITHUB_ENV"
          xcodebuild -version
          if ! xcodebuild -version | grep -qx "Build version $XCODE_BUILD"; then
            echo "::error::Xcode 빌드 버전이 $XCODE_BUILD 가 아닙니다 (DEVELOPER_DIR=$DEVELOPER_DIR)"
            exit 1
          fi
          # 진단용. Gatekeeper 판정은 release.sh 사전 확인(P5)이 한다.
          openssl version
          spctl --status || true
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: 커밋 확인
        env:
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          head=$(git rev-parse HEAD)
          if [[ $head != "$COMMIT" ]]; then
            echo "::error::체크아웃한 커밋 $head 이 판정한 커밋 $COMMIT 과 다릅니다"
            exit 1
          fi
      - uses: jdx/mise-action@v5
      # echo·set -x 금지. p12 는 다음 단계에서 키체인에 넣은 뒤 지우고, 폴더는 마지막 정리 단계가 지운다.
      - name: 자격 증명 파일
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          if [[ -z $P12_BASE64 || -z $P8 ]]; then
            echo "::error::release 환경 시크릿 DEVELOPER_ID_P12_BASE64·NOTARY_API_KEY_P8 이 없습니다 (docs/RELEASING.md 2절)"
            exit 1
          fi
          umask 077
          mkdir -p "$SECRETS_DIR"
          printf '%s' "$P12_BASE64" | base64 --decode > "$SECRETS_DIR/cert.p12"
          printf '%s\n' "$P8" > "$SECRETS_DIR/AuthKey.p8"
      - name: 임시 키체인
        env:
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          scripts/ci-keychain.sh setup "$SECRETS_DIR/cert.p12"
          rm -f "$SECRETS_DIR/cert.p12"
      - name: make release
        env:
          RELEASE_CI: "1"
          NOTARY_KEY_PATH: ${{ runner.temp }}/release-secrets/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: make release
      - id: dmg
        name: dmg 확인
        env:
          MODE: ${{ needs.check.outputs.mode }}
          VERSION: ${{ needs.check.outputs.version }}
          BUILD: ${{ needs.check.outputs.build }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          dmg="build/release/SimLauncher-$VERSION.dmg"
          if [[ ! -f $dmg ]]; then
            echo "::error::$dmg 가 없습니다"
            ls -l build/release || true
            exit 1
          fi
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          if [[ ! $sha =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::SHA-256 을 읽지 못했습니다: $sha"
            exit 1
          fi
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### 배포 dmg"
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 모드 | $MODE |"
            echo "| 버전 | $VERSION ($BUILD) |"
            echo "| 커밋 | \`$COMMIT\` |"
            echo "| SHA-256 | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Re-run all jobs 때 같은 이름과 겹치지 않게 overwrite.
      - uses: actions/upload-artifact@v7
        with:
          name: SimLauncher-dmg
          path: build/release/SimLauncher-${{ needs.check.outputs.version }}.dmg
          retention-days: 3
          overwrite: true
          if-no-files-found: error
      # 공개 레포라 로그인한 누구나 받을 수 있다. xcodebuild·notarytool 로그에는 비밀 값이 없다(RELEASING 1절).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs
          path: |
            build/release/archive.log
            build/release/export.log
            build/release/notary/*.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
      # 일회성 VM 이라 정리 실패는 경고만 한다.
      - name: 정리
        if: always()
        run: |
          scripts/ci-keychain.sh cleanup || echo "::warning::임시 키체인 정리 실패"
          rm -rf "$SECRETS_DIR" || echo "::warning::자격 증명 폴더 정리 실패"

  # 노트 재료와 Claude 요약. 서명 시크릿이 없는 잡이다. 요약이 실패하거나 검사에서 거절되면 PR 목록만으로 게시한다.
  notes:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: 원격 태그 받기
        run: git fetch --force --tags origin
      # 원격 호출 전에 도우미 스크립트 회귀 테스트(토큰 없음)
      - name: 릴리스 도우미 테스트
        run: make release-scripts-test
      - name: 노트 재료
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ needs.check.outputs.commit }}
          TAG: ${{ needs.check.outputs.tag }}
        run: .github/scripts/release-notes.sh prepare "$REPO" "$COMMIT" "$TAG" build/release-notes
      # 버전 고정 설치. 실패하면 요약 없이 진행한다.
      - id: claude-install
        name: Claude Code 설치
        continue-on-error: true
        env:
          CLAUDE_CODE_VERSION: 2.1.323
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          version=$("$HOME/.local/bin/claude" --version)
          echo "$version"
          if [[ $version != "$CLAUDE_CODE_VERSION "* ]]; then
            echo "::error::Claude Code 버전이 $CLAUDE_CODE_VERSION 이 아닙니다: $version"
            exit 1
          fi
      # 도구 없음(--tools ""), 빈 폴더(레포 CLAUDE.md·.claude 를 읽지 않게), GitHub 토큰 없음. 재료는 표준입력으로만 준다.
      - name: 요약 (Claude)
        if: steps.claude-install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          out="$PWD/build/release-notes"
          cd "$(mktemp -d)"
          "$HOME/.local/bin/claude" -p --safe-mode --model opus --tools "" --permission-mode default --strict-mcp-config \
            --setting-sources "" --no-session-persistence --output-format json < "$out/prompt.md" > "$out/claude.json"
          jq -er 'select(.type == "result" and .subtype == "success" and (.is_error | not)) | .result' \
            "$out/claude.json" > "$out/summary-raw.md"
      # 항상 종료 0. 거절·없음은 경고만 하고 summary.md 를 만들지 않는다.
      - name: 요약 검사
        env:
          REPO: ${{ github.repository }}
        run: |
          .github/scripts/release-notes.sh check-summary "$REPO" \
            build/release-notes/summary-raw.md build/release-notes/summary.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes-parts
          path: build/release-notes/
          retention-days: 3
          overwrite: true
          if-no-files-found: error

  # 게시. 쓰기 토큰은 게시 단계의 env 에만 둔다. 시험 실행은 노트만 아티팩트·요약 화면으로 내고 끝난다.
  publish:
    needs: [check, build, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Release 생성·자산 업로드. 초안 Release 도 보인다
    env:
      MODE: ${{ needs.check.outputs.mode }}
      TAG: ${{ needs.check.outputs.tag }}
      COMMIT: ${{ needs.check.outputs.commit }}
      VERSION: ${{ needs.check.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: SimLauncher-dmg
          path: build/dmg
      - uses: actions/download-artifact@v8
        with:
          name: release-notes-parts
          path: build/release-notes
      - name: dmg 해시 확인
        run: |
          actual=$(sha256sum "build/dmg/SimLauncher-$VERSION.dmg" | awk '{print $1}')
          if [[ $actual != "$SHA256" ]]; then
            echo "::error::받은 dmg 의 SHA-256($actual)이 build 잡의 값($SHA256)과 다릅니다"
            exit 1
          fi
      - name: 노트 조립
        run: .github/scripts/release-notes.sh assemble build/release-notes "$VERSION" "$SHA256" "$REPO" > build/release-notes.md
      - if: needs.check.outputs.mode == 'trial'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: build/release-notes.md
          retention-days: 3
          overwrite: true
          if-no-files-found: error
      - name: 시험 실행 노트
        if: needs.check.outputs.mode == 'trial'
        run: |
          {
            echo "### 시험 실행: 게시하지 않았습니다 (SimLauncher $VERSION, \`$COMMIT\`)"
            echo
            cat build/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 게시
        if: needs.check.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 태그가 아직 주석 태그이고 판정한 커밋을 가리키는지 다시 본다(API 만, 얕은 체크아웃에서 된다).
          ref_output=$(mktemp)
          GITHUB_OUTPUT=$ref_output .github/scripts/release-check.sh ref "$REPO" "$TAG"
          tag_commit=$(sed -n 's/^commit=//p' "$ref_output")
          if [[ $tag_commit != "$COMMIT" ]]; then
            echo "::error::태그 $TAG 가 판정 뒤 다른 커밋($tag_commit)으로 바뀌었습니다 (판정: $COMMIT)"
            exit 1
          fi
          # 쓰기 토큰이라 초안까지 보인다. 같은 태그의 Release 가 있으면 멈추고, --latest 는 가장 높은 버전일 때만.
          latest=$(gh api --paginate "repos/$REPO/releases" --jq '.[] | {tag_name, draft, prerelease}' \
            | .github/scripts/release-check.sh plan "$TAG")
          if [[ $latest != true && $latest != false ]]; then
            echo "::error::latest 판정이 true·false 가 아닙니다: $latest"
            exit 1
          fi
          gh release create "$TAG" "build/dmg/SimLauncher-$TAG.dmg" --repo "$REPO" --verify-tag --latest="$latest" \
            --title "SimLauncher $TAG" --notes-file build/release-notes.md
          echo "latest=$latest" >> "$GITHUB_ENV"
      # 게시본 확인. 다르면 실패한다(게시는 남는다 → 사람이 확인, RELEASING 4절).
      - name: 게시 확인
        if: needs.check.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(mktemp)
          gh api "repos/$REPO/releases/tags/$TAG" > "$release"
          state=$(jq -r '[.draft, .prerelease] | map(tostring) | join(" ")' "$release")
          digest=$(jq -r --arg name "SimLauncher-$TAG.dmg" \
            '[.assets[] | select(.name == $name) | .digest // "" | ltrimstr("sha256:")] | first // ""' "$release")
          url=$(jq -r '.html_url' "$release")
          failed=0
          if [[ $state != "false false" ]]; then
            echo "::error::게시본이 초안이거나 prerelease 입니다 (draft prerelease = $state)"
            failed=1
          fi
          if [[ $digest != "$SHA256" ]]; then
            echo "::error::게시된 dmg 의 SHA-256($digest)이 build 잡의 값($SHA256)과 다릅니다"
            failed=1
          fi
          if [[ $latest == true ]]; then
            latest_tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
            if [[ $latest_tag != "$TAG" ]]; then
              echo "::error::latest Release 가 $TAG 가 아니라 $latest_tag 입니다"
              failed=1
            fi
          fi
          echo "### 게시: [SimLauncher $TAG]($url) (latest=$latest)" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
