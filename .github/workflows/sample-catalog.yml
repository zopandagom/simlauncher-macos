name: Sample Catalog

# 카탈로그 예시 워크플로 (docs/CATALOG.md 11절). 샘플 iOS 앱(Examples/SampleApp)을 시뮬레이터용 zip 으로, 샘플 Android 앱
# (Examples/SampleAndroidApp)을 서명한 apk 로 빌드해 같은 빌드 릴리스(태그 sample-build-<run_id>, prerelease)에 함께 올리고,
# 릴리스 목록에서 catalog.json(schemaVersion 2, iOS·Android 앱 둘)을 처음부터 다시 만들어 고정 태그 sample-catalog-v2 의
# prerelease 릴리스에 올린다. 카탈로그 주소:
#   https://github.com/<owner>/<repo>/releases/download/sample-catalog-v2/catalog.json
# 옛 고정 태그 sample-catalog(schemaVersion 1)의 catalog.json 은 더 고치지 않는다 (1.0.0 은 schemaVersion 2 를 읽지 못해,
# 마지막 내용 그대로 1.0.0 사용자에게 남긴다). releases/latest 는 쓰지 않는다 (앱 릴리스·업데이트 확인용으로 비워 둔다).
# 게시(publish 잡)는 기본 브랜치에서만 한다. 기능 브랜치에서 실행하면 빌드 두 잡만 돌아, 머지 전에 빌드·서명을 확인할 수 있고
# 릴리스는 생기지 않는다.
on:
  workflow_dispatch:

# 게시 도중(--clobber 의 삭제와 업로드 사이) 취소되지 않게 ref 마다 한 번에 하나만 돌린다. ref 마다 나눠, 기능 브랜치 실행이
# 기본 브랜치의 게시 대기 실행을 밀어내 취소하지 않게 한다. 게시는 기본 브랜치만 하므로 게시 실행끼리는 한 그룹이다.
# 대기 중인 실행은 같은 ref 의 더 새 실행이 오면 취소되고, 마지막 실행의 카탈로그가 그때까지의 모든 빌드 릴리스를 담는다.
concurrency:
  group: sample-catalog-${{ github.ref }}
  cancel-in-progress: false

# 잡마다 필요한 권한만 준다.
permissions: {}

jobs:
  # 쓰기 권한 없음. mise·tuist·xcodebuild 는 이 잡에서만 돈다.
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version-name: ${{ steps.info.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: 샘플 앱 빌드
        env:
          SAMPLE_BUILD_NUMBER: ${{ github.run_number }}
        run: make sample
      # 릴리스 이름 "<CFBundleShortVersionString> (<CFBundleVersion>)" 을 올릴 zip 안의 Info.plist 에서 읽는다.
      - id: info
        name: 버전 이름
        run: |
          plist=build/SampleApp-Info.plist
          unzip -p build/SampleApp.zip SampleApp.app/Info.plist > "$plist"
          version=$(plutil -extract CFBundleShortVersionString raw "$plist")
          build=$(plutil -extract CFBundleVersion raw "$plist")
          echo "name=$version ($build)" | tee -a "$GITHUB_OUTPUT"
      # 7일 안에는 "Re-run failed jobs" 로 publish 만 다시 돌릴 수 있다. overwrite: "Re-run all jobs" 때 같은 이름과 겹치지 않게.
      - uses: actions/upload-artifact@v7
        with:
          name: SampleApp
          path: build/SampleApp.zip
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # 쓰기 권한·토큰 없음. 러너에 있는 Android SDK(ANDROID_HOME)·JDK 17 로 빌드하고, 고정한 샘플 키로 서명됐는지 확인한다.
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUN_NUMBER: ${{ github.run_number }}
      # Examples/SampleAndroidApp/sample-signing.pem 인증서의 SHA-256 (소문자 hex). 키를 바꾸면 README 와 함께 바꾼다.
      # 다르면 다른 키로 서명된 것이라 테스터 기기의 샘플 앱을 업데이트하지 못한다 (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      SAMPLE_CERT_SHA256: 7dbec183da543847432eeb8fd2ce6adeb9868ec375dc297863920b624f77b230
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # 래퍼 없이 이 버전의 Gradle 을 PATH 에 둔다. 캐시는 끈다 (의존성이 AGP 뿐이라 매번 받아도 되고, 캐시 기능 일부는 독점 라이브러리다).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.8.2"
          cache-disabled: true
      # 비밀이 아닌 샘플 전용 PEM 을 Gradle 이 읽는 PKCS12 로 바꾼다. 러너 임시 폴더에만 두고 올리지 않는다.
      - name: 서명 키 준비
        run: |
          openssl pkcs12 -export -in Examples/SampleAndroidApp/sample-signing.pem -name sample \
            -passout pass:android -out "$RUNNER_TEMP/sample.p12"
      - name: 샘플 Android 앱 빌드
        run: |
          SAMPLE_KEYSTORE="$RUNNER_TEMP/sample.p12" \
            gradle -p Examples/SampleAndroidApp assembleDebug -PsampleBuildNumber="$RUN_NUMBER" --no-daemon
          apks=(Examples/SampleAndroidApp/build/outputs/apk/debug/*.apk)
          [[ ${#apks[@]} == 1 && -f ${apks[0]} ]] || { echo "::error::apk 가 하나가 아닙니다: ${apks[*]}"; exit 1; }
          mkdir -p build
          cp "${apks[0]}" build/SampleAndroidApp.apk
          ls -l build/SampleAndroidApp.apk
      # 앱의 apk 검사와 같은 전제: 맨 위 AndroidManifest.xml 이 정확히 하나 (App Bundle·zip·분할 묶음이 아니다).
      # 서명은 인증서가 하나이고 그 SHA-256 이 고정값과 같아야 한다.
      - name: apk 확인
        run: |
          count=$(zipinfo -1 build/SampleAndroidApp.apk | grep -cx AndroidManifest.xml || true)
          [[ $count == 1 ]] || { echo "::error::apk 맨 위 AndroidManifest.xml 이 하나가 아닙니다: $count"; exit 1; }
          report=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/SampleAndroidApp.apk)
          echo "$report"
          digests=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$report")
          if [[ $digests != "$SAMPLE_CERT_SHA256" ]]; then
            echo "::error::apk 서명 인증서 SHA-256 이 샘플 키와 다릅니다: $digests"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: SampleAndroidApp
          path: build/SampleAndroidApp.apk
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # 쓰기 권한. GitHub 공식 액션만 쓴다(mise 없음, swiftc·gh·jq·curl 은 러너 기본). GH_TOKEN(쓰기 토큰)은 세 단계(빌드 릴리스 게시,
  # 카탈로그 생성, 카탈로그 게시)의 env 에만 두어 그 단계 안의 명령이 모두 받는다(카탈로그 생성은 릴리스 목록 조회와 sample-catalog.sh·jq 실행).
  # 그 밖에는 actions/checkout 이 입력 기본값으로 받는다(persist-credentials: false).
  publish:
    needs: [build, build-android]
    # 기본 브랜치에서만 게시한다. 다른 브랜치에서는 GitHub 이 릴리스 생성을 거절하고(워크플로 파일이 다르다), draft 릴리스가 남는다.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write # 릴리스·태그 생성, 자산 업로드. 레포 기본 토큰 권한이 read 라 명시한다
    env:
      GH_REPO: ${{ github.repository }}
      # 셸에 ${{ }} 를 직접 넣지 않는다 (브랜치 이름의 $(…) 같은 문자)
      BRANCH: ${{ github.ref_name }}
      RUN_NUMBER: ${{ github.run_number }}
      # 재실행(run attempt)에서 바뀌지 않는 id: 같은 run 을 다시 돌리면 같은 태그, 새 실행은 새 태그
      TAG: sample-build-${{ github.run_id }}
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
      CATALOG_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/sample-catalog-v2/catalog.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: SampleApp
          path: build/
      - uses: actions/download-artifact@v7
        with:
          name: SampleAndroidApp
          path: build/
      - name: 받은 zip 확인
        run: |
          top=$(zipinfo -1 build/SampleApp.zip | cut -d/ -f1 | sort -u)
          [[ $top == SampleApp.app ]] || { echo "::error::zip 맨 위가 SampleApp.app 하나가 아닙니다: $top"; exit 1; }
      - name: 받은 apk 확인
        run: |
          count=$(zipinfo -1 build/SampleAndroidApp.apk | grep -cx AndroidManifest.xml || true)
          [[ $count == 1 ]] || { echo "::error::apk 맨 위 AndroidManifest.xml 이 하나가 아닙니다: $count"; exit 1; }
      # 원격에 쓰기 전에 검증기를 컴파일하고 생성기·검증기 회귀 테스트를 돌린다 (토큰 없음).
      - name: 검증기 준비
        run: make catalog-test
      # 같은 run 을 다시 돌리면 이미 게시된 빌드는 그대로 둔다. draft 이거나 zip·apk 중 하나라도 다 올라가지 않았으면 둘 다 다시
      # 올리고 게시한다.
      # 조회에 실패하면(없음·조회 오류) 새로 만든다. 실제로는 있었다면 create 가 실패해 멈춘다 (덮어쓰지 않는다).
      - name: 빌드 릴리스 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if state=$(gh release view "$TAG" --json isDraft,assets --jq '
              [.isDraft, (.assets as $assets | all("SampleApp.zip", "SampleAndroidApp.apk"; . as $name
                | any($assets[]; .name == $name and .state == "uploaded")))] | @tsv'); then
            if [[ $state == $'false\ttrue' ]]; then
              echo "이미 게시됨: $TAG"
            else
              gh release upload "$TAG" build/SampleApp.zip build/SampleAndroidApp.apk --clobber
              gh release edit "$TAG" --draft=false --prerelease
            fi
          else
            printf '%s\n' \
              "SimLauncher 카탈로그 예시 워크플로가 만든 샘플 앱 빌드입니다 (iOS 시뮬레이터용 zip, Android apk)." \
              "branch: $BRANCH" \
              "buildNumber: $RUN_NUMBER" \
              "commit: $GITHUB_SHA" > build/release-notes.md
            # --target 에 커밋을 준다: 브랜치 이름이면 그 사이 브랜치가 움직였을 때 다른 커밋에 태그가 붙는다
            gh release create "$TAG" build/SampleApp.zip build/SampleAndroidApp.apk --target "$GITHUB_SHA" --prerelease \
              --title "$VERSION_NAME" --notes-file build/release-notes.md
          fi
      # 이전 catalog.json 을 읽지 않고 릴리스 목록에서 처음부터 만든다. 방금 만든 릴리스가 두 앱 중 하나에라도 아직 없으면
      # 5초 간격으로 3번 다시 조회한다.
      - name: 카탈로그 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/releases.json
            .github/scripts/sample-catalog.sh build/releases.json > build/catalog.json
            if jq -e --arg tag "$TAG" 'all(.apps[]; any(.versions[]; .id == $tag))' build/catalog.json > /dev/null; then
              exit 0
            fi
            [[ $attempt == 4 ]] || sleep 5
          done
          echo "::error::릴리스 목록에 $TAG 가 없습니다."
          exit 1
      # 앱과 같은 규칙(Core)과 크기 상한, 앱이 iOS·Android 순서로 둘인지, 모든 buildURL 이 그 플랫폼 자산의 태그 고정 주소인지,
      # 이번 빌드가 두 앱 모두에 들었는지. 하나라도 어긋나면 게시하지 않는다.
      - name: 카탈로그 검증
        run: |
          make catalog-check CATALOG=build/catalog.json
          jq -e --arg base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/" --arg tag "$TAG" '
            def asset: if .platform == "ios" then "SampleApp.zip" else "SampleAndroidApp.apk" end;
            (.schemaVersion == 2)
            and (.apps | length == 2)
            and ([.apps[].platform] == ["ios", "android"])
            and all(.apps[]; asset as $asset | all(.versions[];
              (.id | test("^sample-build-[0-9]+$")) and .buildURL == $base + .id + "/" + $asset))
            and all(.apps[]; any(.versions[]; .id == $tag))' build/catalog.json
      # --clobber 는 기존 자산을 지운 뒤 올린다. 업로드가 실패하면 자산 없는 릴리스가 남고, 재실행·다음 실행이 목록에서 다시 만들어 올린다.
      - name: 카탈로그 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view sample-catalog-v2 > /dev/null; then
            gh release create sample-catalog-v2 --prerelease --title "샘플 카탈로그 (schemaVersion 2)" \
              --notes "SimLauncher 카탈로그 예시 워크플로가 올리는 샘플 catalog.json(schemaVersion 2, iOS·Android)입니다. 실행마다 바뀝니다."
          fi
          gh release upload sample-catalog-v2 build/catalog.json --clobber
      - name: 게시 확인
        run: |
          curl -fsSL --retry 3 "$CATALOG_URL" -o build/published.json
          make catalog-check CATALOG=build/published.json
          cmp build/catalog.json build/published.json
      - name: 요약
        run: |
          {
            echo "### 샘플 카탈로그"
            echo "- 카탈로그: $CATALOG_URL"
            echo "- 이번 버전: $VERSION_NAME ($TAG)"
            echo "- iOS 빌드: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/SampleApp.zip"
            echo "- Android 빌드: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/SampleAndroidApp.apk"
          } >> "$GITHUB_STEP_SUMMARY"
